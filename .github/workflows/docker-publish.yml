name: 雲端自動化 CI/CD 打包與推送 Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: 打包 4 個服務並推送到 GHCR
    runs-on: ubuntu-latest

    steps:
      # 步驟 1：拉取最新程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步驟 2：設定 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步驟 3：登入 GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步驟 4：自動打包與推送 Frontend 服務
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/management_platform-frontend:latest

      # 步驟 5：自動打包與推送 Backend 服務
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/management_platform-backend:latest

      # 步驟 6：自動打包與推送 Model Predict 服務
      - name: Build and push Model Predict
        uses: docker/build-push-action@v5
        with:
          context: ./model_predict
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/management_platform-model:latest

      # 步驟 7：自動打包與推送 Train Model 服務
      - name: Build and push Train Model
        uses: docker/build-push-action@v5
        with:
          context: ./train_model
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/management_platform-train_model:latest
